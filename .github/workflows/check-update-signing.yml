name: Check updater signing secrets
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/check-update-signing.yml'
      - 'scripts/check-update-secrets.mjs'
      - 'scripts/check-update-secrets.node-test.mjs'
      - 'src-tauri/tauri.conf.json'
      - 'tools/update-verifier/**'
permissions:
  contents: read
jobs:
  verify-signing:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned build tools
        shell: pwsh
        run: |
          npm install --global pnpm@11.24.0
          rustup toolchain install 1.98.0 --profile minimal
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-update-secrets.node-test.mjs
      - name: Sign ephemeral probe and verify against the existing public key
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: '1.98.0'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-update-secrets.mjs

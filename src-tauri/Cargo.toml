[package]
name = "oria-tunnel"
version = "0.1.0"
edition = "2021"

[lib]
name = "oria_tunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "=2.3.5"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
glob = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9.1"
sha2 = "0.10.9"
rfd = { version = "0.16.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
rand = "0.10"
futures-util = "0.3"

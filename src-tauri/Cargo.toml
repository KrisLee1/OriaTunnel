[package]
name = "oria-tunnel"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "oria_tunnel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "=2.3.5"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13.3"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa"] }
glob = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9.1"
sha2 = "0.10.9"
rfd = { version = "0.16.0", default-features = false }
tauri-plugin-updater = "=2.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSNotification", "NSOperation", "block2"] }
block2 = "0.6"
plist = "1"
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security_Credentials"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
rand = "0.10"
futures-util = "0.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "=0.9.0"
